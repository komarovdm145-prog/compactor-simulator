const frame=document.getElementById('gameFrame');
function inject(doc,tag,attrs){const e=doc.createElement(tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));(tag==='script'?doc.body:doc.head).appendChild(e);return e}
function restore(d){const home=d.getElementById('homeBtn');if(home)home.onclick=()=>{window.location.href='./index.html?v=8.6.16'};const menu=d.querySelector('.menu-actions');if(menu&&!d.getElementById('menuTrainingTest')){const training=d.getElementById('menuTraining'),b=d.createElement('button');b.id='menuTrainingTest';b.textContent='🧪 ОБУЧЕНИЕ TEST';b.onclick=()=>{window.location.href='./test.html?v=6'};if(training)training.after(b);else menu.appendChild(b)}}
frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;[
['link',{rel:'stylesheet',href:'./menu-modern.css?v=8.6.16'}],['link',{rel:'stylesheet',href:'./v8-training.css?v=8.6.16'}],['link',{rel:'stylesheet',href:'./v8-lift-table.css?v=8.6.16'}],['link',{rel:'stylesheet',href:'./v8-guide-carriage.css?v=guide-sync-1'}]
].forEach(x=>inject(d,x[0],x[1]));const shell=inject(d,'script',{src:'./v8-shell.js?v=8.6.16'});shell.onload=()=>{const tr=inject(d,'script',{src:'./v8-training.js?v=8.6.16'});tr.onload=()=>{const lift=inject(d,'script',{src:'./v8-lift-table.js?v=8.6.16'});lift.onload=()=>{const sync=inject(d,'script',{src:'./v8-guide-sync-test.js?v=1'});sync.onload=()=>{restore(d);setTimeout(()=>{restore(d);d.getElementById('menuStart')?.click()},120)}}}}});
